services:
  - type: web
    name: shopbot-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MODEL_NAME
        value: claude-haiku-5-5
      - key: CORS_ORIGINS
        value: "*"
